        release: { type: string }
        service: { type: string }
        request_id: { type: string }
        context:
          type: object
          additionalProperties: true
          description: Present only on trace detail and always server-redacted.
        context_truncated:
          type: boolean
          description: True when an oversized redacted context was omitted to preserve the response-size bound.
    CliTrace:
