:concurrency: <%= Integer(ENV.fetch("SIDEKIQ_CONCURRENCY", 5)) %>
:queues:
  - [projector, 1]
  - [notifications, 1]
  - [mailers, 1]
  - [analytics, 1]
  - [integrations, 1]
  - [symbols, 1]
  - [archives, 1]
  - [maintenance, 1]
  # Safety net for Rails/framework jobs and future jobs before they receive an
  # explicit workload queue. Logister-owned jobs are assigned above.
  - [default, 1]
