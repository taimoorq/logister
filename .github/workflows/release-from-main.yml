name: Backend release from main

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: backend-release-from-main
  cancel-in-progress: false

jobs:
  tag:
    name: Tag current main release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Check out successful commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Verify commit is still current main
        id: candidate
        run: |
          git fetch origin main --tags --force
          candidate_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [ "${candidate_sha}" != "${main_sha}" ]; then
            echo "Successful CI commit ${candidate_sha} is no longer current main (${main_sha}); no release tag will be created."
            exit 1
          fi
          echo "sha=${candidate_sha}" >> "$GITHUB_OUTPUT"

      - name: Validate public release inputs
        id: identity
        run: |
          scripts/publication-safety-check.sh
          bin/check-release-impact --all
          bin/check-release-set
          bin/release-identity --git-sha "${{ steps.candidate.outputs.sha }}" --github-output "$GITHUB_OUTPUT"

      - name: Resolve tag state
        id: tag_state
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null; then
            tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "sha=${tag_sha}" >> "$GITHUB_OUTPUT"
            if [ "${tag_sha}" = "${RELEASE_SHA}" ]; then
              echo "current=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            publishable="$(git diff --name-only "${tag_sha}..${RELEASE_SHA}" | ruby -e '
              ignored = %r{\A(?:\.github|docs|spec|test|tmp|scripts)/|\A(?:AGENTS\.md|LICENSE|README\.md|\.gitignore)\z|\.md\z|\Aconfig/(?:ecosystem\.yml|release-impact(?:\.schema\.json|/))}
              puts STDIN.each_line.map(&:strip).reject(&:empty?).reject { |path| path.match?(ignored) }
            ')"
            if [ -n "${publishable}" ]; then
              echo "Release ${RELEASE_TAG} points to ${tag_sha}, but current main contains publishable changes without a new VERSION:"
              echo "${publishable}"
              exit 1
            fi

            echo "Only documentation, tests, or release tooling changed since ${RELEASE_TAG}; no backend release is required."
            exit 0
          fi

          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "current=false" >> "$GITHUB_OUTPUT"

      - name: Create immutable release tag
        if: steps.tag_state.outputs.exists != 'true'
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${RELEASE_TAG}" --message "Logister ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Recover an incomplete existing release
        if: steps.tag_state.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} is already tagged and has a GitHub Release; the scheduled reconciler owns continuing verification."
          else
            echo "${RELEASE_TAG} is tagged but its GitHub Release is incomplete; dispatching idempotent recovery."
            gh workflow run release.yml --ref main -f tag="${RELEASE_TAG}"
          fi
