name: Reconcile ecosystem release set

on:
  workflow_run:
    workflows: [Publish and deploy backend release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Backend release version without the v prefix
        required: false
        type: string
  schedule:
    - cron: "47 8 * * *"

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: release-set-${{ inputs.version || 'current' }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out public release metadata
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Select and validate release set
        id: release_set
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-$(tr -d '[:space:]' < VERSION)}"
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$'; then
            echo "Requested release-set version is invalid."
            exit 1
          fi
          path="config/release-sets/v${version}.yml"
          if [ ! -f "${path}" ]; then
            echo "Release-set manifest not found: ${path}"
            exit 1
          fi
          bin/check-release-set --release-set "${path}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Reconcile every public release channel
        id: reconcile
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if bin/reconcile-release-set \
            --release-set "${{ steps.release_set.outputs.path }}" \
            --receipt release-set-receipt.json \
            --catalog /tmp/ecosystem-versions.json; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.reconcile.outputs.complete == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Verify every recorded container reference anonymously
        if: steps.reconcile.outputs.complete == 'true'
        run: |
          ruby -rjson -e '
            receipt = JSON.parse(File.read("release-set-receipt.json"))
            container = receipt.fetch("backend").fetch("container")
            digest = container.fetch("digest")
            container.fetch("registries").each_value { |reference| puts "#{reference}\t#{digest}" }
          ' > /tmp/container-references.tsv

          docker logout >/dev/null 2>&1 || true
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker logout quay.io >/dev/null 2>&1 || true
          while IFS=$'\t' read -r reference expected_digest; do
            actual_digest="$(docker buildx imagetools inspect "${reference}" 2>/dev/null | sed -n 's/^Digest:[[:space:]]*//p' | head -1 || true)"
            if [ "${actual_digest}" != "${expected_digest}" ]; then
              echo "Container ${reference} does not expose recorded digest ${expected_digest}."
              exit 1
            fi
          done < /tmp/container-references.tsv

      - name: Attach public ecosystem receipt to backend release
        if: steps.reconcile.outputs.complete == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_set.outputs.tag }}
        run: gh release upload "${RELEASE_TAG}" release-set-receipt.json --clobber

      - name: Prepare verified public version catalog
        id: catalog
        if: steps.reconcile.outputs.complete == 'true'
        run: |
          if cmp --silent /tmp/ecosystem-versions.json config/ecosystem-versions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp /tmp/ecosystem-versions.json config/ecosystem-versions.json
          bin/sync-doc-versions
          scripts/publication-safety-check.sh
          bin/sync-doc-versions --check
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update verified catalog pull request
        if: steps.catalog.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.LOGISTER_CATALOG_BOT_TOKEN }}
          RELEASE_TAG: ${{ steps.release_set.outputs.tag }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "Verified catalog updates require the dedicated catalog bot credential."
            exit 1
          fi
          changed="$(git diff --name-only)"
          invalid="$(printf '%s\n' "${changed}" | grep -Ev '^(config/ecosystem-versions\.json|README\.md|public/llms(-full)?\.txt|docs/(mobile-add-ons|openapi)\.ya?ml|app/services/logister/cli_capabilities\.rb|spec/requests/api/v1/cli_capabilities_spec\.rb|app/views/.*\.erb|cloudflare-docs/.*\.(html|txt))$' || true)"
          if [ -n "${invalid}" ]; then
            echo "Catalog sync attempted to modify unsupported files:"
            echo "${invalid}"
            exit 1
          fi
          branch="bot/release-catalog-${RELEASE_TAG}"
          git config user.name "logister-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          printf '%s\n' "${changed}" | xargs git add --
          git commit -m "Publish verified ecosystem catalog for ${RELEASE_TAG}"
          git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          git push --force-with-lease origin "HEAD:${branch}"
          pr_number="$(gh pr list --state all --head "${branch}" --json number --jq '.[0].number // empty')"
          if [ -n "${pr_number}" ]; then
            gh pr edit "${pr_number}" --title "Publish verified ecosystem catalog for ${RELEASE_TAG}" --body "All release-set channels have been re-read and match the public immutable receipt attached to ${RELEASE_TAG}."
            gh pr reopen "${pr_number}" >/dev/null 2>&1 || true
          else
            gh pr create --base main --head "${branch}" --title "Publish verified ecosystem catalog for ${RELEASE_TAG}" --body "All release-set channels have been re-read and match the public immutable receipt attached to ${RELEASE_TAG}."
            pr_number="$(gh pr list --state open --head "${branch}" --json number --jq '.[0].number')"
          fi
          gh pr merge "${pr_number}" --auto --squash || echo "Auto-merge is unavailable; the verified catalog PR remains open for protected-branch review."

      - name: Record terminal release-set status
        if: always() && steps.release_set.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_set.outputs.tag }}
          COMPLETE: ${{ steps.reconcile.outputs.complete }}
          CATALOG_CHANGED: ${{ steps.catalog.outputs.changed }}
          JOB_STATUS: ${{ job.status }}
        run: |
          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" --force
          release_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
          state=failure
          description="Ecosystem release set is incomplete"
          if [ "${COMPLETE}" = "true" ] && [ "${CATALOG_CHANGED}" != "true" ] && [ "${JOB_STATUS}" = "success" ]; then
            state=success
            description="All required ecosystem channels are verified"
          elif [ "${COMPLETE}" = "true" ] && [ "${CATALOG_CHANGED}" = "true" ]; then
            description="Verified catalog update is pending on main"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${release_sha}" \
            --method POST \
            -f state="${state}" \
            -f context="release/ecosystem" \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Upload release-set receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ecosystem-${{ steps.release_set.outputs.tag || 'unresolved' }}-receipt
          path: release-set-receipt.json
          if-no-files-found: warn

      - name: Keep non-terminal release set pending
        if: steps.reconcile.outputs.complete != 'true' || steps.catalog.outputs.changed == 'true'
        run: |
          echo "The ecosystem release is not terminal yet; scheduled reconciliation will retry without republishing completed artifacts."
          exit 1
